# Weekly dependency updates: one pull request per ecosystem for minor and patch updates, and one
# for major updates (which may need code changes). Security updates are separate and immediate
# (repository settings).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "rust"]
    groups:
      rust:
        update-types: ["minor", "patch"]
      rust-major:
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "javascript"]
    groups:
      npm:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
