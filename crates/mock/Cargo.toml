[package]
name = "twinbase-mock"
description = "Wire-protocol mock servers (PostgreSQL, MySQL, Redis) for TwinBase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bson = { version = "3.1", features = ["serde", "serde_json-1", "chrono-0_4"] }
hmac = "0.13"
sha2 = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
base64.workspace = true
twinbase-engine.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true
uuid.workspace = true
rand.workspace = true
regex = "1"
indexmap = "2"
tempfile = "3"
tokio-postgres = "0.7"
twinbase-firestore-proto.workspace = true
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "server"] }
prost-types = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
bigdecimal = "0.4"
crc32fast = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
pgwire = { version = "0.42", default-features = false, features = ["server-api"] }
# Same version pgwire uses; for extension types (pgvector) in row descriptions.
postgres-types = "0.2.14"
opensrv-mysql = { version = "0.7", default-features = false }
sha1 = "0.11"
md-5 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[dev-dependencies]
tempfile = "3"
mongodb = { version = "3.9", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
chrono.workspace = true
serde_json.workspace = true
uuid.workspace = true
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono", "bigdecimal"] }
tokio-util = { version = "0.7", features = ["compat"] }
bigdecimal = "0.4"
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "chrono"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "aio"] }
futures.workspace = true
