[package]
name = "twinbase-client"
description = "Database client drivers for TwinBase (PostgreSQL, MySQL, SQLite, Redis, MongoDB, DynamoDB, Firestore)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
twinbase-engine.workspace = true
async-trait.workspace = true
base64 = "0.23"
chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "chrono", "rustls-tls", "tls12", "ring"] }
bson = { version = "3.1", features = ["serde", "serde_json-1", "chrono-0_4"] }
mongodb = { version = "3.9", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
indexmap = "2"
twinbase-firestore-proto.workspace = true
tonic = { version = "0.14", default-features = false, features = ["transport", "channel", "codegen", "tls-ring", "tls-webpki-roots"] }
ring = "0.17"
bytes.workspace = true
hmac = "0.13"
sha2 = "0.11"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
scylla = { version = "1.9", default-features = false, features = ["rustls-023", "chrono-04", "bigdecimal-04", "num-bigint-03"] }
oracle = { version = "0.6", features = ["chrono"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono", "bigdecimal"] }
tokio-util = { version = "0.7", features = ["compat"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "aio", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }

[dev-dependencies]
twinbase-mock.workspace = true
