[package]
name = "twinbase-firestore-proto"
description = "Generated gRPC types for the Google Cloud Firestore v1 API (shared by the mock and the client)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router", "server", "channel", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
base64.workspace = true
chrono.workspace = true
serde_json.workspace = true

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
